<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desk Concierge — Architecture</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0d14;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 32px 24px;
    }
    h1 {
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #f8fafc;
      margin-bottom: 4px;
    }
    .subtitle {
      text-align: center;
      font-size: 12px;
      color: #475569;
      margin-bottom: 32px;
    }
    svg { display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <h1>Desk Concierge</h1>
  <p class="subtitle">System Architecture</p>

  <svg width="980" height="760" viewBox="0 0 980 760" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- arrow markers -->
      <marker id="ah"      markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#475569"/></marker>
      <marker id="ah-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3b82f6"/></marker>
      <marker id="ah-grn"  markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#22c55e"/></marker>
      <marker id="ah-pur"  markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#a855f7"/></marker>
      <marker id="ah-ora"  markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#f97316"/></marker>
      <marker id="ah-pink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#e879f9"/></marker>

      <!-- glows -->
      <filter id="glow-ora" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="glow-pur" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="glow-pink" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- ══════════════════════════════════════════
         LAYER BANDS
    ══════════════════════════════════════════ -->

    <!-- Browser -->
    <rect x="12" y="12" width="956" height="168" rx="10" fill="#ffffff05" stroke="#1e293b" stroke-width="1"/>
    <text x="28" y="30" font-size="9" font-weight="700" letter-spacing="0.12em" fill="#334155" text-transform="uppercase">BROWSER</text>

    <!-- Next.js backend -->
    <rect x="12" y="196" width="956" height="258" rx="10" fill="#ffffff04" stroke="#1e293b" stroke-width="1"/>
    <text x="28" y="214" font-size="9" font-weight="700" letter-spacing="0.12em" fill="#334155">NEXT.JS 15 — SERVER</text>

    <!-- External -->
    <rect x="12" y="470" width="956" height="266" rx="10" fill="#ffffff04" stroke="#1e293b" stroke-width="1"/>
    <text x="28" y="488" font-size="9" font-weight="700" letter-spacing="0.12em" fill="#334155">EXTERNAL / PHYSICAL</text>

    <!-- ══════════════════════════════════════════
         BROWSER LAYER
    ══════════════════════════════════════════ -->

    <!-- DeskMap -->
    <rect x="36" y="38" width="390" height="128" rx="8" fill="#111827" stroke="#22c55e" stroke-width="1.5"/>
    <text x="231" y="58"  text-anchor="middle" font-size="12" font-weight="700" fill="#22c55e">DeskMap</text>
    <text x="231" y="74"  text-anchor="middle" font-size="10" fill="#6b7280">4-column pod grid · 8 pods × 5 desks</text>
    <!-- sub-chips -->
    <rect x="52"  y="84" width="110" height="32" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="107" y="97"  text-anchor="middle" font-size="9"  fill="#94a3b8">Feature filter bar</text>
    <text x="107" y="110" text-anchor="middle" font-size="8"  fill="#4b5563">tag toggle → highlight/dim</text>

    <rect x="174" y="84" width="110" height="32" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="229" y="97"  text-anchor="middle" font-size="9"  fill="#94a3b8">DeskCard</text>
    <text x="229" y="110" text-anchor="middle" font-size="8"  fill="#4b5563">LED dot · features · Reserve btn</text>

    <rect x="296" y="84" width="110" height="32" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="351" y="97"  text-anchor="middle" font-size="9"  fill="#94a3b8">Status header</text>
    <text x="351" y="110" text-anchor="middle" font-size="8"  fill="#4b5563">free / occupied / reserved counts</text>

    <text x="231" y="154" text-anchor="middle" font-size="8" fill="#4b5563">SSE (EventSource) · POST /api/desks/[id]/reserve|release</text>

    <!-- ChatPanel -->
    <rect x="554" y="38" width="390" height="128" rx="8" fill="#111827" stroke="#e879f9" stroke-width="1.5"/>
    <text x="749" y="58"  text-anchor="middle" font-size="12" font-weight="700" fill="#e879f9">ChatPanel</text>
    <text x="749" y="74"  text-anchor="middle" font-size="10" fill="#6b7280">Natural language desk assistant</text>

    <rect x="570" y="84" width="170" height="32" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="655" y="97"  text-anchor="middle" font-size="9"  fill="#94a3b8">Message history</text>
    <text x="655" y="110" text-anchor="middle" font-size="8"  fill="#4b5563">user + assistant turns</text>

    <rect x="752" y="84" width="170" height="32" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="837" y="97"  text-anchor="middle" font-size="9"  fill="#94a3b8">Text input</text>
    <text x="837" y="110" text-anchor="middle" font-size="8"  fill="#4b5563">POST /api/chat</text>

    <text x="749" y="154" text-anchor="middle" font-size="8" fill="#4b5563">Sends full message history · receives plain text reply</text>

    <!-- ══════════════════════════════════════════
         NEXT.JS LAYER
    ══════════════════════════════════════════ -->

    <!-- state.ts — centre anchor -->
    <rect x="380" y="224" width="220" height="120" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="490" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#3b82f6">state.ts</text>
    <text x="490" y="262" text-anchor="middle" font-size="9"  fill="#6b7280">Singleton — survives hot-reload via global</text>
    <text x="490" y="278" text-anchor="middle" font-size="8"  fill="#4b5563">Map&lt;id, StoredState&gt;  ·  SSE EventEmitter</text>
    <text x="490" y="292" text-anchor="middle" font-size="8"  fill="#4b5563">MQTT client (singleton)</text>
    <text x="490" y="306" text-anchor="middle" font-size="8"  fill="#4b5563">Auto-release timer · 2 h</text>
    <text x="490" y="322" text-anchor="middle" font-size="8"  fill="#4b5563">LED pub on reserve / release / sensor event</text>
    <text x="490" y="336" text-anchor="middle" font-size="8"  fill="#4b5563">10.6.10.36 : 1883</text>

    <!-- /api/sse -->
    <rect x="36" y="224" width="160" height="68" rx="8" fill="#111827" stroke="#22c55e" stroke-width="1.5"/>
    <text x="116" y="246" text-anchor="middle" font-size="11" font-weight="600" fill="#f1f5f9">GET /api/sse</text>
    <text x="116" y="262" text-anchor="middle" font-size="9"  fill="#6b7280">Server-Sent Events stream</text>
    <text x="116" y="277" text-anchor="middle" font-size="8"  fill="#4b5563">init snapshot + live updates</text>
    <text x="116" y="291" text-anchor="middle" font-size="8"  fill="#4b5563">heartbeat keep-alive</text>

    <!-- /api/desks -->
    <rect x="36" y="306" width="160" height="68" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="116" y="328" text-anchor="middle" font-size="11" font-weight="600" fill="#f1f5f9">GET /api/desks</text>
    <text x="116" y="344" text-anchor="middle" font-size="8"  fill="#4b5563">JSON snapshot of all desks</text>
    <text x="116" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#f1f5f9">POST …/reserve | release</text>
    <text x="116" y="375" text-anchor="middle" font-size="8"  fill="#4b5563">mutates state → LED cmd → SSE</text>

    <!-- /api/chat -->
    <rect x="612" y="224" width="220" height="120" rx="8" fill="#111827" stroke="#e879f9" stroke-width="1.5"/>
    <text x="722" y="246" text-anchor="middle" font-size="11" font-weight="600" fill="#f1f5f9">POST /api/chat</text>
    <text x="722" y="262" text-anchor="middle" font-size="9"  fill="#6b7280">Azure OpenAI agentic loop</text>
    <text x="722" y="278" text-anchor="middle" font-size="8"  fill="#4b5563">Dynamic system prompt (all desk states)</text>
    <text x="722" y="293" text-anchor="middle" font-size="8"  fill="#4b5563">Tools: reserve_desk · release_desk</text>
    <text x="722" y="308" text-anchor="middle" font-size="8"  fill="#4b5563">Loop until finish_reason ≠ tool_calls</text>
    <text x="722" y="323" text-anchor="middle" font-size="8"  fill="#4b5563">model: gpt-5.4-nano · max_tokens 1024</text>
    <text x="722" y="338" text-anchor="middle" font-size="8"  fill="#4b5563">openai SDK (AzureOpenAI client)</text>

    <!-- simulator.ts -->
    <rect x="612" y="360" width="220" height="56" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="722" y="382" text-anchor="middle" font-size="11" font-weight="600" fill="#60a5fa">simulator.ts</text>
    <text x="722" y="398" text-anchor="middle" font-size="8"  fill="#4b5563">Simulates desks 2–40 · random state ~20 s</text>
    <text x="722" y="412" text-anchor="middle" font-size="8"  fill="#4b5563">Publishes to MQTT · started by instrumentation.ts</text>

    <!-- ══════════════════════════════════════════
         EXTERNAL LAYER
    ══════════════════════════════════════════ -->

    <!-- MQTT Broker -->
    <rect x="350" y="496" width="280" height="86" rx="8" fill="#111827" stroke="#a855f7" stroke-width="1.5" filter="url(#glow-pur)"/>
    <text x="490" y="520" text-anchor="middle" font-size="13" font-weight="700" fill="#a855f7">MQTT Broker</text>
    <text x="490" y="538" text-anchor="middle" font-size="10" fill="#6b7280">10.6.10.36 : 1883</text>
    <text x="490" y="554" text-anchor="middle" font-size="8"  fill="#4b5563">desk/+/status  →  occupancy events (retained)</text>
    <text x="490" y="568" text-anchor="middle" font-size="8"  fill="#4b5563">desk/+/led  →  LED colour commands</text>

    <!-- Azure OpenAI -->
    <rect x="680" y="496" width="268" height="86" rx="8" fill="#111827" stroke="#e879f9" stroke-width="1.5" filter="url(#glow-pink)"/>
    <text x="814" y="520" text-anchor="middle" font-size="13" font-weight="700" fill="#e879f9">Azure OpenAI</text>
    <text x="814" y="538" text-anchor="middle" font-size="9"  fill="#6b7280">foundry-hackaton-27-05.cognitiveservices.azure.com</text>
    <text x="814" y="554" text-anchor="middle" font-size="9"  fill="#4b5563">Model: gpt-5.4-nano</text>
    <text x="814" y="568" text-anchor="middle" font-size="8"  fill="#4b5563">Tool use (function calling)  ·  HTTPS</text>

    <!-- ESP32 Device -->
    <rect x="36" y="496" width="288" height="200" rx="8" fill="#111827" stroke="#f97316" stroke-width="1.5" filter="url(#glow-ora)"/>
    <text x="180" y="520" text-anchor="middle" font-size="13" font-weight="700" fill="#f97316">ESP32 — Desk 1 (A1)</text>
    <text x="180" y="537" text-anchor="middle" font-size="9"  fill="#6b7280">Firmware: C++ / PlatformIO · Arduino framework</text>

    <rect x="52" y="548" width="256" height="24" rx="4" fill="#0a0d14"/>
    <text x="180" y="565" text-anchor="middle" font-size="8" fill="#94a3b8">WiFi: WPA2-Enterprise (EAP)  ·  SSID: DB-CTS-WORK</text>

    <rect x="52" y="578" width="256" height="24" rx="4" fill="#0a0d14"/>
    <text x="180" y="592" text-anchor="middle" font-size="8" fill="#94a3b8">KY-032 IR sensor (pin 14) → LOW = occupied</text>
    <text x="180" y="604" text-anchor="middle" font-size="8" fill="#4b5563">polls every 2 s · publish on state change</text>

    <rect x="52" y="608" width="256" height="24" rx="4" fill="#0a0d14"/>
    <text x="180" y="622" text-anchor="middle" font-size="8" fill="#94a3b8">RGB LED (pins 25 / 26 / 27)</text>
    <text x="180" y="634" text-anchor="middle" font-size="8" fill="#4b5563">green=free · yellow=reserved · red=occupied</text>

    <rect x="52" y="638" width="120" height="20" rx="4" fill="#0a0d14"/>
    <text x="112" y="652" text-anchor="middle" font-size="8" fill="#4b5563">OTA (port 3232)</text>

    <rect x="180" y="638" width="128" height="20" rx="4" fill="#0a0d14"/>
    <text x="244" y="652" text-anchor="middle" font-size="8" fill="#4b5563">HTTP log server (port 80)</text>

    <rect x="52" y="664" width="256" height="20" rx="4" fill="#0a0d14"/>
    <text x="180" y="677" text-anchor="middle" font-size="8" fill="#4b5563">CPU temp logging  ·  in-memory log buffer (4 KB)</text>

    <!-- ══════════════════════════════════════════
         ARROWS
    ══════════════════════════════════════════ -->

    <!-- DeskMap ←→ /api/sse  (SSE) -->
    <path d="M 180 166 L 180 190 L 116 190 L 116 224" stroke="#22c55e" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#ah-grn)"/>
    <text x="148" y="186" text-anchor="middle" font-size="8" fill="#22c55e">SSE</text>

    <!-- DeskMap → /api/desks (reserve/release) -->
    <path d="M 116 166 L 116 180 L 80 180 L 80 306" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#ah-blue)"/>
    <text x="56" y="240" font-size="8" fill="#3b82f6">POST</text>

    <!-- ChatPanel → /api/chat -->
    <path d="M 722 166 L 722 190 L 722 224" stroke="#e879f9" stroke-width="1.5" fill="none" marker-end="url(#ah-pink)"/>
    <text x="728" y="200" font-size="8" fill="#e879f9">POST</text>

    <!-- /api/sse ← state.ts -->
    <line x1="380" y1="268" x2="196" y2="268" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#ah-blue)"/>
    <text x="288" y="261" text-anchor="middle" font-size="8" fill="#3b82f6">reads EventEmitter</text>

    <!-- /api/desks ↔ state.ts -->
    <path d="M 196 348 L 290 348 L 290 310 L 380 310" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#ah-blue)"/>
    <text x="290" y="332" font-size="8" fill="#3b82f6" text-anchor="middle">reads / writes</text>

    <!-- /api/chat → state.ts (tool calls) -->
    <line x1="612" y1="295" x2="600" y2="295" stroke="#e879f9" stroke-width="1.5" fill="none"/>
    <line x1="600" y1="295" x2="600" y2="295" stroke="#e879f9" stroke-width="1.5" fill="none" marker-end="url(#ah-pink)"/>
    <path d="M 612 295 L 600 295 L 600 295" stroke="#e879f9" stroke-width="1.5" fill="none" marker-end="url(#ah-pink)"/>
    <line x1="612" y1="290" x2="600" y2="290" stroke="#e879f9" stroke-width="1.5" fill="none"/>
    <path d="M 612 290 L 594 290 L 594 284 L 600 284" stroke="none"/>
    <!-- simpler: just a line -->
    <line x1="612" y1="284" x2="600" y2="284" stroke="#e879f9" stroke-width="1.5" fill="none" marker-end="url(#ah-pink)"/>
    <text x="606" y="276" text-anchor="middle" font-size="8" fill="#e879f9">tool calls</text>

    <!-- /api/chat → Azure OpenAI -->
    <path d="M 832 344 L 832 460 L 814 460 L 814 496" stroke="#e879f9" stroke-width="1.5" fill="none" marker-end="url(#ah-pink)"/>
    <text x="840" y="430" font-size="8" fill="#e879f9">HTTPS</text>

    <!-- simulator → MQTT -->
    <path d="M 722 416 L 722 450 L 560 450 L 560 496" stroke="#a855f7" stroke-width="1.5" fill="none" marker-end="url(#ah-pur)"/>
    <text x="640" y="444" text-anchor="middle" font-size="8" fill="#a855f7">pub simulated states</text>

    <!-- state.ts → MQTT (pub LED) -->
    <path d="M 490 344 L 490 460 L 520 460 L 520 496" stroke="#a855f7" stroke-width="1.5" fill="none" marker-end="url(#ah-pur)"/>
    <text x="500" y="408" font-size="8" fill="#a855f7">pub desk/+/led</text>

    <!-- MQTT → state.ts (sub status) -->
    <path d="M 460 496 L 460 460 L 470 460 L 470 344" stroke="#a855f7" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#ah-pur)"/>
    <text x="418" y="422" font-size="8" fill="#a855f7">sub desk/+/status</text>

    <!-- ESP32 → MQTT (pub status) -->
    <line x1="324" y1="574" x2="350" y2="574" stroke="#f97316" stroke-width="1.5" fill="none" marker-end="url(#ah-ora)"/>
    <text x="336" y="567" text-anchor="middle" font-size="8" fill="#f97316">pub status</text>

    <!-- MQTT → ESP32 (sub LED) -->
    <line x1="350" y1="594" x2="324" y2="594" stroke="#a855f7" stroke-width="1.5" fill="none" marker-end="url(#ah-pur)"/>
    <text x="336" y="612" text-anchor="middle" font-size="8" fill="#a855f7">sub LED cmd</text>

    <!-- ══════════════════════════════════════════
         LEGEND
    ══════════════════════════════════════════ -->
    <rect x="350" y="596" width="280" height="118" rx="8" fill="#0a0d14" stroke="#1e293b" stroke-width="1"/>
    <text x="490" y="614" text-anchor="middle" font-size="10" font-weight="700" fill="#f1f5f9">Legend</text>

    <line x1="368" y1="628" x2="400" y2="628" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ah-grn)"/>
    <text x="408" y="632" font-size="9" fill="#22c55e">SSE  (real-time push)</text>

    <line x1="368" y1="646" x2="400" y2="646" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ah-blue)"/>
    <text x="408" y="650" font-size="9" fill="#3b82f6">HTTP / REST</text>

    <line x1="368" y1="664" x2="400" y2="664" stroke="#a855f7" stroke-width="1.5" marker-end="url(#ah-pur)"/>
    <text x="408" y="668" font-size="9" fill="#a855f7">MQTT  pub/sub</text>

    <line x1="368" y1="682" x2="400" y2="682" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ah-pur)"/>
    <text x="408" y="686" font-size="9" fill="#a855f7">MQTT  subscribe</text>

    <line x1="368" y1="700" x2="400" y2="700" stroke="#e879f9" stroke-width="1.5" marker-end="url(#ah-pink)"/>
    <text x="408" y="704" font-size="9" fill="#e879f9">Azure OpenAI API</text>

    <line x1="368" y1="718" x2="400" y2="718" stroke="#f97316" stroke-width="1.5" marker-end="url(#ah-ora)"/>
    <text x="408" y="722" font-size="9" fill="#f97316">IoT sensor event</text>

  </svg>
</body>
</html>
