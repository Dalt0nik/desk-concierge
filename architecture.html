<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desk Concierge — Architecture</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 32px;
    }
    h1 {
      text-align: center;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #f8fafc;
      margin-bottom: 6px;
    }
    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #64748b;
      margin-bottom: 36px;
    }
    svg { display: block; margin: 0 auto; }

    /* ── box styles ── */
    .box-iot    { fill: #1e293b; stroke: #f97316; stroke-width: 1.5; }
    .box-mqtt   { fill: #1e293b; stroke: #a855f7; stroke-width: 1.5; }
    .box-next   { fill: #1e293b; stroke: #3b82f6; stroke-width: 1.5; }
    .box-ai     { fill: #1e293b; stroke: #d946ef; stroke-width: 1.5; }
    .box-ui     { fill: #1e293b; stroke: #22c55e; stroke-width: 1.5; }
    .box-user   { fill: #1e293b; stroke: #94a3b8; stroke-width: 1.5; }

    .inner-box  { fill: #0f172a; stroke: none; rx: 6; }

    /* ── labels ── */
    .label-title { font-size: 13px; font-weight: 700; fill: #f1f5f9; }
    .label-sub   { font-size: 10px; fill: #94a3b8; }
    .label-tag   { font-size: 9px;  fill: #64748b; }
    .label-api   { font-size: 10px; font-weight: 600; fill: #e2e8f0; }

    /* ── layer bands ── */
    .layer-band  { fill: #ffffff08; }
    .layer-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; fill: #475569; }

    /* ── arrows ── */
    .arrow       { stroke: #475569; stroke-width: 1.5; fill: none; stroke-dasharray: none; marker-end: url(#arrowhead); }
    .arrow-dashed{ stroke: #475569; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; marker-end: url(#arrowhead); }
    .arrow-iot   { stroke: #f97316; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-iot); }
    .arrow-mqtt  { stroke: #a855f7; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-mqtt); }
    .arrow-ai    { stroke: #d946ef; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-ai); }
    .arrow-sse   { stroke: #22c55e; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; marker-end: url(#arrowhead-sse); }
    .arrow-http  { stroke: #3b82f6; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-http); }

    .arrow-label { font-size: 9px; fill: #64748b; }
    .arrow-label-iot  { font-size: 9px; fill: #f97316; }
    .arrow-label-mqtt { font-size: 9px; fill: #a855f7; }
    .arrow-label-ai   { font-size: 9px; fill: #d946ef; }
    .arrow-label-sse  { font-size: 9px; fill: #22c55e; }
    .arrow-label-http { font-size: 9px; fill: #3b82f6; }

    .chip { fill: #0f172a; rx: 4; }
    .chip-text { font-size: 9px; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Desk Concierge — Architecture</h1>
  <p class="subtitle">Anthropic Claude ↔ IoT Integration</p>

  <svg width="960" height="820" viewBox="0 0 960 820" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- generic -->
      <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#475569" />
      </marker>
      <!-- IoT orange -->
      <marker id="arrowhead-iot" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#f97316" />
      </marker>
      <!-- MQTT purple -->
      <marker id="arrowhead-mqtt" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#a855f7" />
      </marker>
      <!-- AI pink -->
      <marker id="arrowhead-ai" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#d946ef" />
      </marker>
      <!-- SSE green -->
      <marker id="arrowhead-sse" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#22c55e" />
      </marker>
      <!-- HTTP blue -->
      <marker id="arrowhead-http" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#3b82f6" />
      </marker>

      <!-- glow filters -->
      <filter id="glow-orange"><feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glow-purple"><feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glow-pink"><feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glow-green"><feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>

    <!-- ════════════════════════════════════════════
         LAYER BANDS (background)
    ═════════════════════════════════════════════ -->

    <!-- Layer: Browser -->
    <rect x="10" y="10" width="940" height="130" rx="12" class="layer-band" />
    <text x="26" y="28" class="layer-label">Browser / Client</text>

    <!-- Layer: Next.js Backend -->
    <rect x="10" y="200" width="940" height="310" rx="12" class="layer-band" />
    <text x="26" y="218" class="layer-label">Next.js 15 — App Router (Server)</text>

    <!-- Layer: External Services -->
    <rect x="10" y="570" width="940" height="230" rx="12" class="layer-band" />
    <text x="26" y="588" class="layer-label">External / Physical Layer</text>


    <!-- ════════════════════════════════════════════
         LAYER 1 — BROWSER
    ═════════════════════════════════════════════ -->

    <!-- User -->
    <rect x="400" y="30" width="160" height="50" rx="8" class="box-user" />
    <text x="480" y="51" text-anchor="middle" class="label-title">👤 User</text>
    <text x="480" y="67" text-anchor="middle" class="label-sub">Web Browser</text>

    <!-- DeskMap Component -->
    <rect x="80" y="50" width="240" height="76" rx="8" class="box-ui" />
    <text x="200" y="70" text-anchor="middle" class="label-title" style="fill:#22c55e">DeskMap</text>
    <text x="200" y="85" text-anchor="middle" class="label-sub">Desk grid — 8 pods × 5 desks</text>
    <text x="200" y="100" text-anchor="middle" class="label-tag">Reserve / Release buttons</text>
    <text x="200" y="114" text-anchor="middle" class="label-tag">LED status indicators (green / yellow / red)</text>

    <!-- ChatPanel Component -->
    <rect x="640" y="50" width="240" height="76" rx="8" class="box-ui" />
    <text x="760" y="70" text-anchor="middle" class="label-title" style="fill:#22c55e">ChatPanel</text>
    <text x="760" y="85" text-anchor="middle" class="label-sub">Natural language desk assistant</text>
    <text x="760" y="100" text-anchor="middle" class="label-tag">Message history  ·  Text input</text>
    <text x="760" y="114" text-anchor="middle" class="label-tag">Sends POST /api/chat</text>


    <!-- ════════════════════════════════════════════
         LAYER 2 — NEXT.JS BACKEND
    ═════════════════════════════════════════════ -->

    <!-- state.ts -->
    <rect x="380" y="228" width="200" height="110" rx="8" class="box-next" />
    <text x="480" y="248" text-anchor="middle" class="label-title" style="fill:#3b82f6">state.ts</text>
    <text x="480" y="264" text-anchor="middle" class="label-sub">Singleton state module</text>
    <text x="480" y="279" text-anchor="middle" class="label-tag">In-memory Map&lt;id, DeskState&gt;</text>
    <text x="480" y="293" text-anchor="middle" class="label-tag">MQTT client (singleton)</text>
    <text x="480" y="307" text-anchor="middle" class="label-tag">SSE EventEmitter</text>
    <text x="480" y="321" text-anchor="middle" class="label-tag">Auto-release timer (2 h)</text>

    <!-- /api/sse -->
    <rect x="60" y="228" width="160" height="80" rx="8" class="box-next" />
    <text x="140" y="250" text-anchor="middle" class="label-api">GET /api/sse</text>
    <text x="140" y="265" text-anchor="middle" class="label-sub">Server-Sent Events</text>
    <text x="140" y="280" text-anchor="middle" class="label-tag">Initial state snapshot</text>
    <text x="140" y="294" text-anchor="middle" class="label-tag">Real-time push updates</text>

    <!-- /api/desks -->
    <rect x="60" y="328" width="160" height="70" rx="8" class="box-next" />
    <text x="140" y="348" text-anchor="middle" class="label-api">GET /api/desks</text>
    <text x="140" y="363" text-anchor="middle" class="label-sub">Desk snapshot (JSON)</text>
    <rect x="60" y="408" width="160" height="40" rx="8" class="box-next" />
    <text x="140" y="425" text-anchor="middle" class="label-api">POST …/reserve|release</text>
    <text x="140" y="440" text-anchor="middle" class="label-tag">Trigger state change + LED cmd</text>

    <!-- /api/chat -->
    <rect x="640" y="228" width="200" height="110" rx="8" class="box-next" />
    <text x="740" y="248" text-anchor="middle" class="label-api">POST /api/chat</text>
    <text x="740" y="264" text-anchor="middle" class="label-sub">Claude Haiku agent loop</text>
    <text x="740" y="280" text-anchor="middle" class="label-tag">Dynamic system prompt</text>
    <text x="740" y="295" text-anchor="middle" class="label-tag">Tools: reserve_desk, release_desk</text>
    <text x="740" y="310" text-anchor="middle" class="label-tag">Iterates until stop_reason=end_turn</text>
    <text x="740" y="325" text-anchor="middle" class="label-tag">@anthropic-ai/sdk  ·  max_tokens 1024</text>

    <!-- simulator.ts -->
    <rect x="64" y="470" width="280" height="60" rx="8" class="box-next" />
    <text x="204" y="492" text-anchor="middle" class="label-api" style="fill:#60a5fa">simulator.ts</text>
    <text x="204" y="507" text-anchor="middle" class="label-sub">Occupancy simulation (desks 2–40)</text>
    <text x="204" y="522" text-anchor="middle" class="label-tag">Publishes random MQTT events every ~20 s  ·  Launched by instrumentation.ts</text>


    <!-- ════════════════════════════════════════════
         LAYER 3 — EXTERNAL / PHYSICAL
    ═════════════════════════════════════════════ -->

    <!-- MQTT Broker -->
    <rect x="330" y="595" width="300" height="90" rx="8" class="box-mqtt" filter="url(#glow-purple)" />
    <text x="480" y="618" text-anchor="middle" class="label-title" style="fill:#a855f7">MQTT Broker</text>
    <text x="480" y="636" text-anchor="middle" class="label-sub">10.250.251.10 : 1883</text>
    <text x="480" y="652" text-anchor="middle" class="label-tag">Topic: desk/+/status  →  occupancy events</text>
    <text x="480" y="668" text-anchor="middle" class="label-tag">Topic: desk/+/led  →  LED colour commands</text>

    <!-- Anthropic API -->
    <rect x="680" y="595" width="240" height="90" rx="8" class="box-ai" filter="url(#glow-pink)" />
    <text x="800" y="618" text-anchor="middle" class="label-title" style="fill:#d946ef">Anthropic API</text>
    <text x="800" y="636" text-anchor="middle" class="label-sub">claude-haiku-4-5-20251001</text>
    <text x="800" y="652" text-anchor="middle" class="label-tag">Tool use (function calling)</text>
    <text x="800" y="668" text-anchor="middle" class="label-tag">Conversational desk-booking agent</text>

    <!-- ESP32 Device -->
    <rect x="40" y="595" width="260" height="140" rx="8" class="box-iot" filter="url(#glow-orange)" />
    <text x="170" y="618" text-anchor="middle" class="label-title" style="fill:#f97316">ESP32 Device — Desk 1</text>
    <text x="170" y="634" text-anchor="middle" class="label-sub">Physical sensor node (C++ / PlatformIO)</text>

    <!-- inner details -->
    <rect x="56" y="646" width="228" height="24" rx="4" fill="#0f172a" />
    <text x="170" y="663" text-anchor="middle" class="label-tag">KY-032 IR sensor (pin 14)  →  occupied / free</text>
    <rect x="56" y="676" width="228" height="24" rx="4" fill="#0f172a" />
    <text x="170" y="693" text-anchor="middle" class="label-tag">RGB LED (pins 25/26/27)  ←  colour commands</text>
    <rect x="56" y="706" width="228" height="20" rx="4" fill="#0f172a" />
    <text x="170" y="720" text-anchor="middle" class="label-tag">OTA updates  ·  HTTP status page</text>


    <!-- ════════════════════════════════════════════
         ARROWS
    ═════════════════════════════════════════════ -->

    <!-- User → ChatPanel -->
    <line x1="480" y1="80" x2="640" y2="88" class="arrow" />
    <text x="550" y="74" text-anchor="middle" class="arrow-label">types message</text>

    <!-- User → DeskMap (clicks) -->
    <line x1="400" y1="72" x2="320" y2="88" class="arrow" />
    <text x="350" y="72" text-anchor="middle" class="arrow-label">clicks reserve</text>

    <!-- DeskMap ↔ /api/sse  (SSE) -->
    <path d="M 200 126 L 200 160 L 140 160 L 140 228" class="arrow-sse" />
    <text x="156" y="172" class="arrow-label-sse">SSE stream</text>

    <!-- DeskMap → /api/desks/reserve|release -->
    <path d="M 200 126 L 200 180 L 100 180 L 100 408" class="arrow-http" />
    <text x="56" y="198" class="arrow-label-http">POST reserve/release</text>

    <!-- ChatPanel → /api/chat -->
    <path d="M 760 126 L 760 180 L 740 180 L 740 228" class="arrow-http" />
    <text x="768" y="172" class="arrow-label-http">POST /api/chat</text>

    <!-- /api/sse ↔ state.ts -->
    <line x1="220" y1="268" x2="380" y2="268" class="arrow-http" />
    <text x="300" y="260" text-anchor="middle" class="arrow-label-http">reads EventEmitter</text>

    <!-- /api/desks ↔ state.ts -->
    <path d="M 220 363 L 290 363 L 290 295 L 380 295" class="arrow-http" />
    <text x="310" y="318" class="arrow-label-http">reads/writes state</text>

    <!-- /api/chat → state.ts (tool execution) -->
    <path d="M 640 300 L 580 300" class="arrow-ai" />
    <text x="605" y="292" class="arrow-label-ai">tool calls</text>

    <!-- /api/chat ↔ Anthropic API -->
    <path d="M 740 338 L 740 540 L 800 540 L 800 595" class="arrow-ai" />
    <text x="816" y="540" class="arrow-label-ai">HTTPS</text>

    <!-- state.ts → MQTT (publish LED cmd) -->
    <path d="M 480 338 L 480 595" class="arrow-mqtt" />
    <text x="488" y="480" class="arrow-label-mqtt">pub desk/+/led</text>

    <!-- state.ts ← MQTT (subscribe occupancy) -->
    <path d="M 460 595 L 460 338" class="arrow-mqtt" />
    <text x="408" y="490" class="arrow-label-mqtt">sub desk/+/status</text>

    <!-- simulator → MQTT -->
    <path d="M 280 500 L 380 500 L 380 595" class="arrow-mqtt" />
    <text x="348" y="490" class="arrow-label-mqtt">pub simulated events</text>

    <!-- ESP32 → MQTT (sensor publish) -->
    <path d="M 300" y1="640" d="M 300 640 L 330 640" class="arrow-iot" />
    <line x1="300" y1="640" x2="330" y2="640" class="arrow-iot" />
    <text x="314" y="632" text-anchor="middle" class="arrow-label-iot">pub status</text>

    <!-- MQTT → ESP32 (LED command) -->
    <line x1="330" y1="660" x2="300" y2="660" class="arrow-mqtt" />
    <text x="314" y="676" text-anchor="middle" class="arrow-label-mqtt">sub LED cmd</text>


    <!-- ════════════════════════════════════════════
         LEGEND
    ═════════════════════════════════════════════ -->
    <rect x="680" y="710" width="250" height="98" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="805" y="727" text-anchor="middle" class="label-title" style="font-size:11px">Legend</text>

    <!-- SSE -->
    <line x1="700" y1="742" x2="730" y2="742" class="arrow-sse" />
    <text x="736" y="746" class="arrow-label-sse" style="font-size:10px">SSE (real-time push)</text>
    <!-- HTTP -->
    <line x1="700" y1="758" x2="730" y2="758" class="arrow-http" />
    <text x="736" y="762" class="arrow-label-http" style="font-size:10px">HTTP / REST</text>
    <!-- MQTT -->
    <line x1="700" y1="774" x2="730" y2="774" class="arrow-mqtt" />
    <text x="736" y="778" class="arrow-label-mqtt" style="font-size:10px">MQTT pub/sub</text>
    <!-- AI -->
    <line x1="700" y1="790" x2="730" y2="790" class="arrow-ai" />
    <text x="736" y="794" class="arrow-label-ai" style="font-size:10px">Anthropic API (HTTPS)</text>
    <!-- IoT -->
    <line x1="700" y1="806" x2="730" y2="806" class="arrow-iot" />
    <text x="736" y="810" class="arrow-label-iot" style="font-size:10px">IoT sensor events</text>

  </svg>
</body>
</html>
