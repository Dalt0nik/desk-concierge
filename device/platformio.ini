[env:esp32dev]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    knolleary/PubSubClient @ ^2.8

build_flags =
    -DCORE_DEBUG_LEVEL=3

# ── OTA upload (uncomment and set IP to push wirelessly) ──────────────────────
# upload_protocol = espota
# upload_port     = 192.168.1.xxx
# upload_flags    = --auth=your-ota-password
